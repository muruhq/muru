[project]
name = "shop"
version = "0.1.0"
requires-python = ">=3.11"

[tool.muru]
entrypoint = "app:application"
processes = 1
threads = 4

[tool.muru.scaling]
mode = "spare"
min_workers = 1
max_workers = 4
min_spare = 0
max_spare = 2
scale_in_window = "20s"
reap_interval = "5s"
min_lifetime = "10s"
idle_reap_after = "30s"
