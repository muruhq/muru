[package]
name = "muru-common"
description = "Shared pieces of Muru: the writing of its own log lines and the times on them, and process titles."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = ["log"]
# Muru's own log lines, which the extension does without.
log = ["dep:jiff", "dep:serde_json"]

[dependencies]
jiff = { workspace = true, optional = true }
libc = { workspace = true }
serde_json = { workspace = true, optional = true }

[lints]
workspace = true
